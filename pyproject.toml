[project]
name = "gnn-pruner"
version = "0.1.0"
description = "Structure-aware document retrieval and pruning prototype"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "scikit-learn>=1.3",
]

[project.optional-dependencies]
pdf = ["pymupdf>=1.24,<2"]
docx = ["python-docx>=1.1"]
embeddings = ["sentence-transformers>=2.6"]
vector = ["faiss-cpu>=1.8"]
llm = ["anthropic>=1", "openai>=1"]
dev = ["pytest>=8", "pymupdf>=1.24,<2", "python-docx>=1.1"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
